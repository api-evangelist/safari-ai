name: Safari Ai
description: >-
  Safari AI is a vision-AI company for physical operations, turning an
  organization's existing camera networks into an automated operational system.
  Its Action Center platform measures on-site activity (people counts and
  footfall, occupancy, heatmapping, throughput, queue wait time, dwell time,
  vehicle counts, and license-plate recognition), raises alerts, recommends and
  dispatches actions, and attributes outcomes — measurement to action in under
  60 seconds. Safari AI serves theme parks and cultural attractions, stadiums
  and arenas, QSR and drive-thrus, retail and shopping malls, parking, and
  logistics. Backed by General Catalyst, it exposes no public developer API;
  customers consume results through a hosted real-time dashboard (Grafana)
  rather than a self-serve API surface. This profile was surfaced from the VC
  portfolio graph and enriched from the company's public site.
